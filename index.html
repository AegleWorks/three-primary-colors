<!doctype html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<link rel="icon" type="image/svg" href="/vcl.svg" />
	<link rel="stylesheet" href="/src/style.css">
	<link rel="stylesheet" href="/src/styles/theme.css">
	<link rel="stylesheet" href="/src/styles/background.css">
	<link rel="stylesheet" href="/src/styles/score.css">
	<link rel="stylesheet" href="/src/styles/scrollbar.css">
	<link rel="stylesheet" href="/src/styles/test.css">
	<title>Operation TRICOLOR // Overlay</title>
</head>

<body>
	<div id="app" class="absolute top-0 left-0 w-[1920px] h-[1080px]">
		<div class="absolute top-0 left-0 size-full transition-all" id="background"></div>
		<div id="topBar"
			class="absolute top-0 left-0 w-full h-[100px] px-10 flex items-center justify-between text-custom-text">
			<div class="flex flex-col items-start gap-2.5">
				<div id="nameLeft" class="text-xl">Team Left</div>
				<div id="starLeft" class="flex gap-1"></div>
			</div>
			<div class="flex flex-col items-end gap-2.5">
				<div id="nameRight" class="text-xl">Team Right</div>
				<div id="starRight" class="flex gap-1 flex-row-reverse"></div>
			</div>
		</div>
		<div id="main" class="absolute top-[100px] w-full h-[720px]">
			<div class="absolute top-0 left-0 w-full h-full" id="resultContainer"></div>
			<div class="absolute top-0 left-0 w-full h-full p-5 flex flex-col items-center gap-8 transition-all"
				style="clip-path: polygon(0% 0%, 0% 0%, 0% 100%, 0% 100%)" id="mappoolContainer"></div>
		</div>
		<div id="bottomBar" class="absolute bottom-0 left-0 w-full h-[260px] text-custom-text">
			<div id="scoreContainer" class="absolute top-0 left-0 w-full h-full opacity-0 transition-opacity">
				<div id="containerLeft" class="absolute top-0 left-0 w-[50%] h-3 flex justify-end">
					<div id="anchorLeft"></div>
					<div id="barLeftContainer" class="h-3 flex justify-end">
						<div id="barLeft" class="h-full bg-custom-side-left"></div>
					</div>
					<div id="scoreLeft" class="absolute text-4xl top-5 p-2.5">0</div>
				</div>
				<div class="absolute right-[50%] top-0 text-sm px-2.5 py-1" id="difference">0</div>
				<div id="containerRight" class="absolute top-0 right-0 w-[50%] h-3 flex">
					<div id="barRightContainer" class="h-3 flex justify-start">
						<div id="barRight" class="h-full bg-custom-side-right"></div>
					</div>
					<div id="anchorRight"></div>
					<div id="scoreRight" class="absolute text-4xl top-5 p-2.5">0</div>
				</div>
			</div>
			<div id="info" class="absolute top-0 left-0 w-full h-full p-5 flex gap-5 text-custom-text">
				<div id="chat"
					class="p-5 bg-custom-bg-chat rounded-xl border-spacing-custom-border border-custom-border w-[50%] h-full overflow-hidden transition-opacity">
					<div id="chatInner" class="flex flex-col w-full h-full overflow-auto"></div>
				</div>
				<div id="beatmap" class="w-[50%] h-full flex flex-col gap-5 ">
					<div id="metadata"
						class="relative grow-1 h-[50%] bg-black flex flex-col justify-center p-5 bg-cover bg-center transition-transform rounded-xl overflow-hidden border-spacing-custom-border border-custom-border">
						<div class="absolute top-0 left-0 bg-black/70 w-full h-full"></div>
						<div class="relative text-2xl line-clamp-1 font-medium">
							<span id="artist"></span>
							-
							<span id="title"></span>
						</div>
						<div class="relative text-lg line-clamp-1">
							Difficulty: <span id="difficulty"></span>
							-
							Mapper: <span id="mapper"></span>
						</div>
						<div id="picker" class="absolute w-[0px] right-0 h-full text-lg font-semibold justify-center text-center overflow-hidden transition-all"></div>
					</div>
					<div id="stats" class="w-full h-[50%] text-lg justify-center flex flex-col p-5">
						<div class="flex gap-2.5">
							<div>CS: <span class="font-medium" id="CS"></span></div> /
							<div>AR: <span class="font-medium" id="AR"></span></div> /
							<div>OD: <span class="font-medium" id="OD"></span></div> /
							<div>BPM: <span class="font-medium" id="BPM"></span></div>
						</div>
						<div class="flex gap-5">
							<div>Star Rating: <span class="font-medium" id="SR"></span>*</div>/
							<div>Length: <span class="font-medium" id="length"></span></div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
	<div id="debug" class="absolute top-[1080px] p-5 bg-mantle w-[1920px] flex gap-5 text-text">
		<div class="flex flex-col gap-5 p-5 rounded-xl border-1 border-surface-0 bg-base">
			<div class="flex w-full items-center gap-5">
				<input type="checkbox" name="testMode" id="testMode">
				<label for="testMode" class="font-medium">Test Mode</label>
			</div>
			<div class="flex w-full flex-col gap-2.5">
				<div class="font-medium text-lg">Scoring</div>
				<div class="flex w-full gap-5">
					<div class="flex gap-5 items-center">
						<label for="testScoreLeft">Left</label>
						<input type="number" name="testScoreLeft" id="testScoreLeft" value="0">
					</div>
					<div class="flex gap-5 items-center">
						<label for="testScoreRight">Right</label>
						<input type="number" name="testScoreRight" id="testScoreRight" value="0">
					</div>
				</div>
			</div>
			<div class="flex w-full flex-col gap-2.5">
				<div class="font-medium text-lg">Game State</div>
				<div class="flex w-full gap-5">
					<div class="flex gap-5 items-center">
						<input type="checkbox" name="testScoreVisible" id="testScoreVisible">
						<label for="testScoreVisible">Score Visible?</label>
					</div>
					<div class="flex gap-5 items-center">
						<input type="checkbox" name="testStarsVisible" id="testStarsVisible">
						<label for="testStarsVisible">Stars Visible?</label>
					</div>
				</div>
			</div>
		</div>
		<div class="flex flex-col gap-5 p-5 rounded-xl border-1 border-surface-0 bg-base text-text">
			<div class="font-medium">Control</div>
			<button id="toggleMappool"
				type="button"
				class="p-5 rounded-xl bg-base border-1 border-surface-0 cursor-pointer hover:bg-surface-0">Toggle
				Mappool</button>
			<div class="font-medium">Scoring Condition</div>
			<div class="flex items-center gap-8">
				<div class="flex items-center gap-2.5">
					<input type="radio" checked="true" name="scoring" id="scoring-score" value="score"
						class="appearance-none w-5 h-5 rounded-full border-2 border-surface-0 checked:border-text before:content-['_'] before:transition-all before:w-0 before:h-0 checked:before:w-2.5 checked:before:h-2.5 before:rounded-full before:block before:bg-text flex items-center justify-center transition-all">
					<label for="scoring-score">Score</label>
				</div>
				<div class="flex items-center gap-2.5">
					<input type="radio" name="scoring" id="scoring-acc" value="acc"
						class="appearance-none w-5 h-5 rounded-full border-2 border-surface-0 checked:border-text before:content-['_'] before:transition-all before:w-0 before:h-0 checked:before:w-2.5 checked:before:h-2.5 before:rounded-full before:block before:bg-text flex items-center justify-center transition-all">
					<label for="scoring-acc">Accuracy</label>
				</div>
				<div class="flex items-center gap-2.5">
					<input type="radio" name="scoring" id="scoring-combo" value="combo"
						class="appearance-none w-5 h-5 rounded-full border-2 border-surface-0 checked:border-text before:content-['_'] before:transition-all before:w-0 before:h-0 checked:before:w-2.5 checked:before:h-2.5 before:rounded-full before:block before:bg-text flex items-center justify-center transition-all">
					<label for="scoring-combo">Max Combo</label>
				</div>
				<div class="flex items-center gap-2.5">
					<input type="radio" name="scoring" id="scoring-miss" value="miss"
						class="appearance-none w-5 h-5 rounded-full border-2 border-surface-0 checked:border-text before:content-['_'] before:transition-all before:w-0 before:h-0 checked:before:w-2.5 checked:before:h-2.5 before:rounded-full before:block before:bg-text flex items-center justify-center transition-all">
					<label for="scoring-miss">Lowest Misscount</label>
				</div>
			</div>
		</div>
		<div class="flex flex-col gap-5 p-5 rounded-xl border-1 border-surface-0 bg-base text-text">
			<div class="font-medium text-lg flex items-center justify-between">
				<span>OBS Auto-Tiling (Hyprland Mode)</span>
				<span id="obsStatusDot" class="w-3 h-3 rounded-full bg-red-500 inline-block" title="Disconnected"></span>
			</div>
			<div class="flex flex-col gap-2.5 text-sm">
				<div class="flex items-center gap-2">
					<label for="obsUrl" class="w-24">WS URL:</label>
					<input type="text" id="obsUrl" value="ws://127.0.0.1:4455" class="bg-surface-0 px-2 py-1 rounded border border-surface-1 text-text flex-1">
				</div>
				<div class="flex items-center gap-2">
					<label for="obsPassword" class="w-24">Password:</label>
					<input type="password" id="obsPassword" placeholder="(Optional)" class="bg-surface-0 px-2 py-1 rounded border border-surface-1 text-text flex-1">
				</div>
				<div class="flex items-center gap-2">
					<label for="obsSceneName" class="w-24">Scene Name:</label>
					<input type="text" id="obsSceneName" value="osu! rempalago" class="bg-surface-0 px-2 py-1 rounded border border-surface-1 text-text flex-1">
				</div>
				<div class="flex items-center gap-2">
					<label for="obsLayoutMode" class="w-24">Layout:</label>
					<select id="obsLayoutMode" class="bg-surface-0 px-2 py-1 rounded border border-surface-1 text-text flex-1">
						<option value="dwindle">Dwindle (Hyprland)</option>
						<option value="grid">Balanced Grid</option>
						<option value="master-stack">Master-Stack</option>
						<option value="team-split">Team Split (Left vs Right)</option>
					</select>
				</div>
				<div class="flex items-center gap-4 mt-1">
					<div class="flex items-center gap-2">
						<label for="obsGap">Gap:</label>
						<input type="number" id="obsGap" value="8" min="0" max="64" class="w-16 bg-surface-0 px-2 py-1 rounded border border-surface-1 text-text">
					</div>
					<div class="flex items-center gap-2">
						<input type="checkbox" id="obsAutoTile" checked>
						<label for="obsAutoTile">Auto-Tile on Client Change</label>
					</div>
				</div>
			</div>
			<div class="flex flex-col gap-2">
				<button id="obsAutoSetupBtn" type="button" class="w-full py-2.5 px-4 rounded-xl bg-blue-600 hover:bg-blue-500 text-white cursor-pointer font-semibold text-sm transition-colors shadow">⚡ Auto-Setup 'osu! rempalago' Scene</button>
				<div id="obsSetupStatus" class="text-xs min-h-[1rem]"></div>
			</div>
			<div class="flex gap-2.5">
				<button id="obsConnectBtn" type="button" class="flex-1 py-2 px-4 rounded-xl bg-surface-0 hover:bg-surface-1 cursor-pointer font-medium text-sm">Connect to OBS</button>
				<button id="obsApplyBtn" type="button" class="flex-1 py-2 px-4 rounded-xl bg-surface-0 hover:bg-surface-1 cursor-pointer font-medium text-sm">Apply Layout Now</button>
			</div>
		</div>
	</div>
	<script type="module" src="/src/main.ts"></script>
</body>

</html>
